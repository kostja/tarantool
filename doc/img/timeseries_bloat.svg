<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 300" font-family="Consolas, monospace" font-size="11">
  <defs>
    <marker id="arr" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto">
      <path d="M0,0 L7,2.5 L0,5" fill="#2B2D2C"/>
    </marker>
    <pattern id="dead" patternUnits="userSpaceOnUse" width="8" height="8" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#E23956" stroke-width="1.5" opacity="0.4"/>
    </pattern>
  </defs>

  <text x="350" y="20" text-anchor="middle" font-size="13" font-weight="bold" fill="#2B2D2C">Time-series bloat &#x043F;&#x0440;&#x0438; &#x0440;&#x0430;&#x0437;&#x0431;&#x0438;&#x0435;&#x043D;&#x0438;&#x0438; &#x0434;&#x0438;&#x0430;&#x043F;&#x0430;&#x0437;&#x043E;&#x043D;&#x043E;&#x0432;</text>

  <!-- Step 1: Before split -->
  <text x="110" y="50" text-anchor="middle" font-size="12" font-weight="bold" fill="#073DA4">1. &#x0414;&#x043E; &#x0440;&#x0430;&#x0437;&#x0431;&#x0438;&#x0435;&#x043D;&#x0438;&#x044F;</text>

  <rect x="20" y="60" width="180" height="80" rx="4" fill="#E8F0FE" stroke="#0C47B7" stroke-width="1.5"/>
  <text x="110" y="82" text-anchor="middle" fill="#073DA4" font-size="10" font-weight="bold">&#x0414;&#x0438;&#x0430;&#x043F;&#x0430;&#x0437;&#x043E;&#x043D; [A..Z)</text>
  <rect x="30" y="92" width="160" height="22" rx="3" fill="#B3CBF7" stroke="#0C47B7"/>
  <text x="110" y="107" text-anchor="middle" fill="#073DA4" font-size="9">run R1: 192 MB (&#x043F;&#x043E;&#x043B;&#x043D;&#x044B;&#x0439;)</text>
  <text x="110" y="132" text-anchor="middle" fill="#999" font-size="9">&#x2265; 1.5&#x00D7; &#x043E;&#x0442; 128 MB &#x2192; split!</text>

  <!-- Arrow -->
  <line x1="210" y1="100" x2="240" y2="100" stroke="#2B2D2C" stroke-width="1.2" marker-end="url(#arr)"/>

  <!-- Step 2: After split -->
  <text x="370" y="50" text-anchor="middle" font-size="12" font-weight="bold" fill="#CC5400">2. &#x041F;&#x043E;&#x0441;&#x043B;&#x0435; &#x0440;&#x0430;&#x0437;&#x0431;&#x0438;&#x0435;&#x043D;&#x0438;&#x044F;</text>

  <!-- Bottom range -->
  <rect x="250" y="60" width="120" height="80" rx="4" fill="#FFF0E0" stroke="#FF6900" stroke-width="1.5"/>
  <text x="310" y="78" text-anchor="middle" fill="#CC5400" font-size="10" font-weight="bold">[A..M)</text>
  <rect x="258" y="85" width="104" height="22" rx="3" fill="#FFD4A8" stroke="#FF6900"/>
  <text x="310" y="100" text-anchor="middle" fill="#CC5400" font-size="9">slice (R1, 0-96MB)</text>
  <text x="310" y="125" text-anchor="middle" fill="#008050" font-size="9">96 MB &#x0436;&#x0438;&#x0432;&#x044B;&#x0445;</text>

  <!-- Top range (active) -->
  <rect x="380" y="60" width="120" height="80" rx="4" fill="#E0F8ED" stroke="#00B36B" stroke-width="1.5"/>
  <text x="440" y="78" text-anchor="middle" fill="#008050" font-size="10" font-weight="bold">[M..Z)</text>
  <rect x="388" y="85" width="104" height="22" rx="3" fill="#A3E8C8" stroke="#00B36B"/>
  <text x="440" y="100" text-anchor="middle" fill="#008050" font-size="9">slice (R1, 96-192MB)</text>
  <text x="440" y="125" text-anchor="middle" fill="#008050" font-size="9">&#x2190; &#x0441;&#x044E;&#x0434;&#x0430; &#x043F;&#x0438;&#x0448;&#x0435;&#x043C;</text>

  <!-- Step 3: After more writes + split of top range -->
  <text x="350" y="170" text-anchor="middle" font-size="12" font-weight="bold" fill="#E23956">3. &#x0427;&#x0435;&#x0440;&#x0435;&#x0437; N &#x0434;&#x0430;&#x043C;&#x043F;&#x043E;&#x0432;: &#x0435;&#x0449;&#x0451; &#x043E;&#x0434;&#x043D;&#x043E; &#x0440;&#x0430;&#x0437;&#x0431;&#x0438;&#x0435;&#x043D;&#x0438;&#x0435;</text>

  <!-- Range 1: cold, dead data growing -->
  <rect x="20" y="190" width="140" height="100" rx="4" fill="#FFF0E0" stroke="#FF6900" stroke-width="1.5"/>
  <text x="90" y="208" text-anchor="middle" fill="#CC5400" font-size="10" font-weight="bold">[A..M)</text>
  <rect x="30" y="215" width="120" height="20" rx="3" fill="url(#dead)" stroke="#E23956"/>
  <text x="90" y="229" text-anchor="middle" fill="#E23956" font-size="8">R1: 50% &#x043C;&#x0451;&#x0440;&#x0442;&#x0432;&#x044B;&#x0445;</text>
  <text x="90" y="255" text-anchor="middle" fill="#E23956" font-size="9" font-weight="bold">shape OK &#x2192;</text>
  <text x="90" y="270" text-anchor="middle" fill="#E23956" font-size="9" font-weight="bold">&#x043D;&#x0435;&#x0442; compaction!</text>

  <!-- Range 2 -->
  <rect x="170" y="190" width="140" height="100" rx="4" fill="#FFF0E0" stroke="#FF6900" stroke-width="1.5"/>
  <text x="240" y="208" text-anchor="middle" fill="#CC5400" font-size="10" font-weight="bold">[M..T)</text>
  <rect x="180" y="215" width="120" height="20" rx="3" fill="url(#dead)" stroke="#E23956"/>
  <text x="240" y="229" text-anchor="middle" fill="#E23956" font-size="8">R2: 50% &#x043C;&#x0451;&#x0440;&#x0442;&#x0432;&#x044B;&#x0445;</text>
  <text x="240" y="255" text-anchor="middle" fill="#E23956" font-size="9" font-weight="bold">shape OK &#x2192;</text>
  <text x="240" y="270" text-anchor="middle" fill="#E23956" font-size="9" font-weight="bold">&#x043D;&#x0435;&#x0442; compaction!</text>

  <!-- Range 3 -->
  <rect x="320" y="190" width="140" height="100" rx="4" fill="#FFF0E0" stroke="#FF6900" stroke-width="1.5"/>
  <text x="390" y="208" text-anchor="middle" fill="#CC5400" font-size="10" font-weight="bold">[T..W)</text>
  <rect x="330" y="215" width="120" height="20" rx="3" fill="url(#dead)" stroke="#E23956"/>
  <text x="390" y="229" text-anchor="middle" fill="#E23956" font-size="8">R3: 50% &#x043C;&#x0451;&#x0440;&#x0442;&#x0432;&#x044B;&#x0445;</text>
  <text x="390" y="255" text-anchor="middle" fill="#E23956" font-size="9" font-weight="bold">shape OK &#x2192;</text>
  <text x="390" y="270" text-anchor="middle" fill="#E23956" font-size="9" font-weight="bold">&#x043D;&#x0435;&#x0442; compaction!</text>

  <!-- Range 4: active -->
  <rect x="470" y="190" width="140" height="100" rx="4" fill="#E0F8ED" stroke="#00B36B" stroke-width="1.5"/>
  <text x="540" y="208" text-anchor="middle" fill="#008050" font-size="10" font-weight="bold">[W..Z)</text>
  <rect x="480" y="215" width="120" height="20" rx="3" fill="#A3E8C8" stroke="#00B36B"/>
  <text x="540" y="229" text-anchor="middle" fill="#008050" font-size="8">&#x2190; &#x043F;&#x0438;&#x0448;&#x0435;&#x043C; &#x0441;&#x044E;&#x0434;&#x0430;</text>
</svg>
