<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 320" font-family="Consolas, monospace" font-size="11">
  <!-- Title -->
  <text x="300" y="18" text-anchor="middle" font-size="13" font-weight="bold" fill="#2B2D2C">&#x0421;&#x0442;&#x0430;&#x0434;&#x043D;&#x044B;&#x0439; &#x044D;&#x0444;&#x0444;&#x0435;&#x043A;&#x0442; &#x0438; &#x0440;&#x0430;&#x043D;&#x0434;&#x043E;&#x043C;&#x0438;&#x0437;&#x0430;&#x0446;&#x0438;&#x044F;</text>

  <!-- Without randomization -->
  <text x="150" y="45" text-anchor="middle" font-size="12" font-weight="bold" fill="#E23956">&#x0411;&#x0435;&#x0437; &#x0440;&#x0430;&#x043D;&#x0434;&#x043E;&#x043C;&#x0438;&#x0437;&#x0430;&#x0446;&#x0438;&#x0438;</text>

  <!-- Time axis -->
  <line x1="30" y1="170" x2="280" y2="170" stroke="#2B2D2C" stroke-width="1"/>
  <text x="155" y="185" text-anchor="middle" fill="#666" font-size="10">&#x0432;&#x0440;&#x0435;&#x043C;&#x044F; &#x2192;</text>

  <!-- IO axis -->
  <line x1="30" y1="170" x2="30" y2="55" stroke="#2B2D2C" stroke-width="1"/>
  <text x="18" y="112" fill="#666" font-size="10" transform="rotate(-90,18,112)">I/O</text>

  <!-- Spike -->
  <rect x="60" y="60" width="25" height="110" rx="2" fill="#E23956"/>
  <text x="72" y="55" text-anchor="middle" fill="#E23956" font-size="9">&#x0434;&#x0430;&#x043C;&#x043F;</text>

  <!-- All ranges compact at once -->
  <rect x="90" y="62" width="60" height="108" rx="2" fill="#B02040" opacity="0.8"/>
  <text x="120" y="55" text-anchor="middle" fill="#E23956" font-size="8">1000 &#x0441;&#x043B;&#x0438;&#x044F;&#x043D;&#x0438;&#x0439;</text>

  <!-- Calm period -->
  <rect x="155" y="155" width="60" height="15" rx="2" fill="#A3E8C8"/>

  <!-- Next spike -->
  <rect x="220" y="60" width="25" height="110" rx="2" fill="#E23956"/>
  <rect x="248" y="62" width="30" height="108" rx="2" fill="#B02040" opacity="0.8"/>

  <!-- Threshold line -->
  <line x1="30" y1="90" x2="280" y2="90" stroke="#E23956" stroke-width="0.8" stroke-dasharray="4"/>
  <text x="285" y="93" fill="#E23956" font-size="9">write stall</text>

  <!-- With randomization -->
  <text x="450" y="45" text-anchor="middle" font-size="12" font-weight="bold" fill="#008050">&#x0421; &#x0440;&#x0430;&#x043D;&#x0434;&#x043E;&#x043C;&#x0438;&#x0437;&#x0430;&#x0446;&#x0438;&#x0435;&#x0439; (10%)</text>

  <!-- Time axis -->
  <line x1="320" y1="170" x2="580" y2="170" stroke="#2B2D2C" stroke-width="1"/>
  <text x="450" y="185" text-anchor="middle" fill="#666" font-size="10">&#x0432;&#x0440;&#x0435;&#x043C;&#x044F; &#x2192;</text>

  <!-- IO axis -->
  <line x1="320" y1="170" x2="320" y2="55" stroke="#2B2D2C" stroke-width="1"/>
  <text x="308" y="112" fill="#666" font-size="10" transform="rotate(-90,308,112)">I/O</text>

  <!-- Distributed compactions -->
  <rect x="350" y="115" width="20" height="55" rx="2" fill="#00B36B"/>
  <text x="360" y="108" text-anchor="middle" fill="#008050" font-size="8">&#x0434;&#x0430;&#x043C;&#x043F;</text>

  <rect x="373" y="105" width="40" height="65" rx="2" fill="#009959" opacity="0.7"/>
  <text x="393" y="98" text-anchor="middle" fill="#008050" font-size="8">~900</text>

  <rect x="418" y="120" width="30" height="50" rx="2" fill="#00B36B" opacity="0.6"/>

  <rect x="455" y="130" width="25" height="40" rx="2" fill="#00D084" opacity="0.5"/>
  <text x="467" y="123" text-anchor="middle" fill="#008050" font-size="8">~100</text>

  <rect x="490" y="115" width="20" height="55" rx="2" fill="#00B36B"/>
  <rect x="513" y="108" width="40" height="62" rx="2" fill="#009959" opacity="0.7"/>

  <!-- Threshold line -->
  <line x1="320" y1="90" x2="580" y2="90" stroke="#008050" stroke-width="0.8" stroke-dasharray="4"/>
  <text x="585" y="93" fill="#008050" font-size="9">OK</text>

  <!-- Legend -->
  <rect x="100" y="210" width="400" height="90" rx="6" fill="#f5f5f5" stroke="#ccc"/>
  <rect x="115" y="225" width="14" height="14" rx="2" fill="#E23956"/>
  <text x="135" y="236" fill="#2B2D2C" font-size="10">&#x0434;&#x0430;&#x043C;&#x043F; (&#x0441;&#x0431;&#x0440;&#x043E;&#x0441; &#x0438;&#x0437; &#x043F;&#x0430;&#x043C;&#x044F;&#x0442;&#x0438; &#x043D;&#x0430; &#x0434;&#x0438;&#x0441;&#x043A;)</text>
  <rect x="115" y="248" width="14" height="14" rx="2" fill="#B02040" opacity="0.8"/>
  <text x="135" y="259" fill="#2B2D2C" font-size="10">&#x0441;&#x043B;&#x0438;&#x044F;&#x043D;&#x0438;&#x044F; (&#x0432;&#x0441;&#x0435; &#x0434;&#x0438;&#x0430;&#x043F;&#x0430;&#x0437;&#x043E;&#x043D;&#x044B; &#x0441;&#x0440;&#x0430;&#x0437;&#x0443; &#x2192; I/O &#x0448;&#x0442;&#x043E;&#x0440;&#x043C;)</text>
  <rect x="115" y="271" width="14" height="14" rx="2" fill="#00D084" opacity="0.6"/>
  <text x="135" y="282" fill="#2B2D2C" font-size="10">10% &#x0434;&#x0438;&#x0430;&#x043F;&#x0430;&#x0437;&#x043E;&#x043D;&#x043E;&#x0432; &#x043E;&#x0442;&#x043A;&#x043B;&#x0430;&#x0434;&#x044B;&#x0432;&#x0430;&#x044E;&#x0442; &#x0441;&#x043B;&#x0438;&#x044F;&#x043D;&#x0438;&#x0435; &#x2192; &#x043D;&#x0430;&#x0433;&#x0440;&#x0443;&#x0437;&#x043A;&#x0430; &#x0440;&#x0430;&#x0437;&#x043C;&#x0430;&#x0437;&#x0430;&#x043D;&#x0430;</text>
</svg>
