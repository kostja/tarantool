<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 260" font-family="Consolas, monospace" font-size="11">
  <defs>
    <marker id="arr" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto">
      <path d="M0,0 L7,2.5 L0,5" fill="#2B2D2C"/>
    </marker>
  </defs>

  <text x="280" y="20" text-anchor="middle" font-size="13" font-weight="bold" fill="#2B2D2C">Shape-based compaction: &#x0444;&#x043E;&#x0440;&#x043C;&#x0430; &#x0434;&#x0435;&#x0440;&#x0435;&#x0432;&#x0430;</text>

  <!-- Level 0 (newest, up to run_count_per_level = 2 files) -->
  <rect x="210" y="40" width="60" height="28" rx="3" fill="#E0F8ED" stroke="#00B36B" stroke-width="1.5"/>
  <text x="240" y="58" text-anchor="middle" fill="#008050" font-size="9">10 MB</text>

  <rect x="290" y="40" width="60" height="28" rx="3" fill="#E0F8ED" stroke="#00B36B" stroke-width="1.5"/>
  <text x="320" y="58" text-anchor="middle" fill="#008050" font-size="9">10 MB</text>

  <text x="145" y="58" text-anchor="end" fill="#666" font-size="10">&#x0423;&#x0440;&#x043E;&#x0432;&#x0435;&#x043D;&#x044C; 0</text>
  <text x="380" y="58" fill="#999" font-size="9">run_count_per_level = 2</text>

  <!-- Level 1 -->
  <rect x="190" y="90" width="100" height="28" rx="3" fill="#E8F0FE" stroke="#0C47B7" stroke-width="1.5"/>
  <text x="240" y="108" text-anchor="middle" fill="#073DA4" font-size="9">35 MB</text>

  <rect x="300" y="90" width="100" height="28" rx="3" fill="#E8F0FE" stroke="#0C47B7" stroke-width="1.5"/>
  <text x="350" y="108" text-anchor="middle" fill="#073DA4" font-size="9">35 MB</text>

  <text x="145" y="108" text-anchor="end" fill="#666" font-size="10">&#x0423;&#x0440;&#x043E;&#x0432;&#x0435;&#x043D;&#x044C; 1</text>
  <text x="430" y="108" fill="#999" font-size="9">&#x00D7; run_size_ratio (3.5)</text>

  <!-- Level 2 (bottom, single file) -->
  <rect x="150" y="140" width="260" height="28" rx="3" fill="#FFF0E0" stroke="#FF6900" stroke-width="1.5"/>
  <text x="280" y="158" text-anchor="middle" fill="#CC5400" font-size="9">122 MB (&#x0435;&#x0434;&#x0438;&#x043D;&#x0441;&#x0442;&#x0432;&#x0435;&#x043D;&#x043D;&#x044B;&#x0439; &#x0444;&#x0430;&#x0439;&#x043B;)</text>

  <text x="145" y="158" text-anchor="end" fill="#666" font-size="10">&#x0423;&#x0440;&#x043E;&#x0432;&#x0435;&#x043D;&#x044C; 2</text>
  <text x="440" y="158" fill="#E23956" font-size="9">&#x2190; &#x0440;&#x043E;&#x0432;&#x043D;&#x043E; 1</text>

  <!-- Compaction trigger annotation -->
  <rect x="35" y="195" width="240" height="55" rx="5" fill="#FCE4EA" stroke="#E23956" stroke-width="1.2"/>
  <text x="155" y="213" text-anchor="middle" fill="#E23956" font-size="10" font-weight="bold">&#x0422;&#x0440;&#x0438;&#x0433;&#x0433;&#x0435;&#x0440; compaction:</text>
  <text x="155" y="230" text-anchor="middle" fill="#E23956" font-size="10">&#x0415;&#x0441;&#x043B;&#x0438; &#x043D;&#x0430; &#x0443;&#x0440;&#x043E;&#x0432;&#x043D;&#x0435; &#x043F;&#x043E;&#x044F;&#x0432;&#x0438;&#x0442;&#x0441;&#x044F; 3-&#x0439; &#x0444;&#x0430;&#x0439;&#x043B;</text>
  <text x="155" y="244" text-anchor="middle" fill="#E23956" font-size="10">&#x2192; &#x0441;&#x043B;&#x0438;&#x044F;&#x043D;&#x0438;&#x0435; &#x0441; &#x043D;&#x0438;&#x0436;&#x043D;&#x0438;&#x043C; &#x0443;&#x0440;&#x043E;&#x0432;&#x043D;&#x0435;&#x043C;</text>

  <!-- Size calculation -->
  <rect x="295" y="195" width="240" height="55" rx="5" fill="#E8F0FE" stroke="#0C47B7" stroke-width="1.2"/>
  <text x="415" y="213" text-anchor="middle" fill="#073DA4" font-size="10" font-weight="bold">&#x0420;&#x0430;&#x0441;&#x0447;&#x0451;&#x0442; &#x0441;&#x043D;&#x0438;&#x0437;&#x0443; &#x0432;&#x0432;&#x0435;&#x0440;&#x0445;:</text>
  <text x="415" y="230" text-anchor="middle" fill="#073DA4" font-size="10">bottom = 122 MB (&#x0444;&#x0430;&#x043A;&#x0442;)</text>
  <text x="415" y="244" text-anchor="middle" fill="#073DA4" font-size="10">level 1 = ceil(122/3.5) = 35 MB</text>

</svg>
