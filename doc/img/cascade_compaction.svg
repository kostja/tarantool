<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 200" font-family="Consolas, monospace" font-size="13">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#2B2D2C"/>
    </marker>
  </defs>

  <!-- L0 -->
  <rect x="160" y="10" width="200" height="36" rx="4" fill="#E0F8ED" stroke="#00B36B" stroke-width="1.5"/>
  <text x="260" y="33" text-anchor="middle" font-weight="bold" fill="#008050">L0 (memory)</text>
  <text x="390" y="33" fill="#999" font-size="11">&#x2190; INSERT {key=42}</text>

  <!-- Arrow L0 → L1 -->
  <line x1="260" y1="46" x2="260" y2="76" stroke="#2B2D2C" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="275" y="66" fill="#E23956" font-size="11">L0 full &#x2192; dump</text>

  <!-- L1 -->
  <rect x="120" y="80" width="280" height="36" rx="4" fill="#E8F0FE" stroke="#0C47B7" stroke-width="1.5"/>
  <text x="260" y="103" text-anchor="middle" font-weight="bold" fill="#073DA4">L1 (disk, ~10 MB)</text>

  <!-- Arrow L1 → L2 -->
  <line x1="260" y1="116" x2="260" y2="146" stroke="#2B2D2C" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="275" y="136" fill="#E23956" font-size="11">L1 full &#x2192; merge L1+L2</text>

  <!-- L2 -->
  <rect x="60" y="150" width="400" height="36" rx="4" fill="#FFF0E0" stroke="#FF6900" stroke-width="1.5"/>
  <text x="260" y="173" text-anchor="middle" font-weight="bold" fill="#CC5400">L2 (disk, ~100 MB)</text>

</svg>
