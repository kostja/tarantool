<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 310" font-family="Consolas, monospace" font-size="11">

  <text x="310" y="18" text-anchor="middle" font-size="13" font-weight="bold" fill="#2B2D2C">Выбор кластера пересекающихся run-файлов</text>

  <!-- Key axis -->
  <line x1="60" y1="260" x2="560" y2="260" stroke="#2B2D2C" stroke-width="1.5"/>
  <text x="60" y="278" text-anchor="middle" fill="#666" font-size="10">A</text>
  <text x="210" y="278" text-anchor="middle" fill="#666" font-size="10">H</text>
  <text x="360" y="278" text-anchor="middle" fill="#666" font-size="10">P</text>
  <text x="560" y="278" text-anchor="middle" fill="#666" font-size="10">Z</text>
  <text x="310" y="295" text-anchor="middle" fill="#999" font-size="10">&#x043A;&#x043B;&#x044E;&#x0447;&#x0438; &#x2192;</text>

  <!-- Run files as horizontal bars, newest on top -->
  <!-- R5 (newest): A..F -->
  <rect x="60" y="40" width="140" height="24" rx="3" fill="#E8F0FE" stroke="#0C47B7" stroke-width="1.5"/>
  <text x="130" y="56" text-anchor="middle" fill="#073DA4" font-size="10">R5 [A..F]</text>

  <!-- R4: D..K -->
  <rect x="120" y="72" width="180" height="24" rx="3" fill="#E8F0FE" stroke="#0C47B7" stroke-width="1.5"/>
  <text x="210" y="88" text-anchor="middle" fill="#073DA4" font-size="10">R4 [D..K]</text>

  <!-- R3: G..N -->
  <rect x="180" y="104" width="180" height="24" rx="3" fill="#E8F0FE" stroke="#0C47B7" stroke-width="1.5"/>
  <text x="270" y="120" text-anchor="middle" fill="#073DA4" font-size="10">R3 [G..N]</text>

  <!-- R2: R..W -->
  <rect x="380" y="136" width="120" height="24" rx="3" fill="#FFF0E0" stroke="#FF6900" stroke-width="1.5"/>
  <text x="440" y="152" text-anchor="middle" fill="#CC5400" font-size="10">R2 [R..W]</text>

  <!-- R1 (oldest): T..Z -->
  <rect x="420" y="168" width="140" height="24" rx="3" fill="#FFF0E0" stroke="#FF6900" stroke-width="1.5"/>
  <text x="490" y="184" text-anchor="middle" fill="#CC5400" font-size="10">R1 [T..Z]</text>

  <!-- Freshness labels -->
  <text x="45" y="56" text-anchor="end" fill="#999" font-size="9">&#x043D;&#x043E;&#x0432;&#x044B;&#x0435;</text>
  <text x="45" y="184" text-anchor="end" fill="#999" font-size="9">&#x0441;&#x0442;&#x0430;&#x0440;&#x044B;&#x0435;</text>
  <line x1="50" y1="62" x2="50" y2="178" stroke="#ccc" stroke-width="0.8" stroke-dasharray="3"/>

  <!-- New scheduler: bracket around overlapping cluster R3+R4+R5 -->
  <rect x="55" y="35" width="310" height="100" rx="6" fill="none" stroke="#00B36B" stroke-width="2" stroke-dasharray="6"/>
  <text x="52" y="220" fill="#008050" font-size="11" font-weight="bold">&#x2714; merge (&#x043A;&#x043B;&#x0430;&#x0441;&#x0442;&#x0435;&#x0440; 3 &#x0444;&#x0430;&#x0439;&#x043B;&#x043E;&#x0432;)</text>

  <!-- Skip annotation for R1+R2 -->
  <text x="375" y="220" fill="#CC5400" font-size="11" font-weight="bold">&#x2718; skip (&#x043D;&#x0435; &#x043F;&#x0435;&#x0440;&#x0435;&#x0441;&#x0435;&#x043A;&#x0430;&#x044E;&#x0442;&#x0441;&#x044F;)</text>

  <!-- Old scheduler annotation -->
  <line x1="55" y1="242" x2="565" y2="242" stroke="#E23956" stroke-width="1.5" stroke-dasharray="4"/>
  <text x="310" y="255" text-anchor="middle" fill="#E23956" font-size="10">&#x0421;&#x0442;&#x0430;&#x0440;&#x044B;&#x0439; &#x043F;&#x043B;&#x0430;&#x043D;&#x0438;&#x0440;&#x043E;&#x0432;&#x0449;&#x0438;&#x043A;: merge &#x0432;&#x0441;&#x0435;&#x0445; 5 &#x2192; &#x043B;&#x0438;&#x0448;&#x043D;&#x044F;&#x044F; &#x0440;&#x0430;&#x0431;&#x043E;&#x0442;&#x0430;</text>
</svg>
